name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: swift test
      - name: Build universal release
        run: ./scripts/release.sh
      - name: Check packaged executable
        run: '"dist/Codex Pace.app/Contents/MacOS/CodexPace" --help'
      - name: Upload release archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Codex-Pace-macos-universal-${{ runner.arch }}
          path: |
            dist/Codex-Pace-*-macos-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
